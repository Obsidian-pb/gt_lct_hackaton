<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход · 112</title>
<link rel="stylesheet" href="/welcome.css">
<style>
.auth-welcome{padding-top:15.5vh}
.auth-welcome .welcome-intro{margin-top:72px}
.auth-form{margin-top:28px}
.auth-fields{display:grid;gap:14px;margin-top:18px}
.auth-field{display:grid;gap:7px;font-size:13px;color:#4d5962}
.auth-field input{width:100%;height:48px;border:1px solid #bcc7cf;background:rgba(255,255,255,.88);padding:0 14px;font:15px Arial,sans-serif;color:#111;outline:none}
.auth-field input:focus{border-color:#354b5b;box-shadow:0 0 0 2px rgba(53,75,91,.12)}
.auth-error{margin-top:12px;padding:10px 12px;background:#fff0f1;border:1px solid #efc6ca;color:#a62e38;font-size:12px;line-height:1.45}
.auth-submit{display:flex;align-items:center;justify-content:center;position:relative;background:#494d52;color:#fff;border:0;width:100%;height:64px;margin-top:20px;font:18px Arial,sans-serif;cursor:pointer;transition:background .15s}
.auth-submit span{position:absolute;right:25px;font-size:28px}.auth-submit:hover{background:#303438}.auth-submit:disabled{opacity:.6;cursor:wait}
.auth-help{display:block;margin-top:14px;color:#7a8288;font-size:11px;line-height:1.5}
@media(max-width:760px){.auth-welcome{padding-top:32px}.auth-welcome .welcome-intro{margin-top:36px}.auth-form{margin-top:22px}}
</style>
</head>
<body>
<main class="welcome auth-welcome">
 <img class="welcome-logo" src="/hero-logo.svg" alt="112" width="185" height="106">
 <div class="welcome-intro">
  <h1 id="title">Вход · Преподаватель</h1>
  <p id="description">Введите логин и пароль, которые выдал администратор системы.</p>
 </div>
 <form id="login-form" class="auth-form" autocomplete="on">
  <div class="welcome-roles" role="group" aria-label="Войти как">
   <button type="button" data-role="teacher" aria-pressed="true">Преподаватель</button>
   <button type="button" data-role="student" aria-pressed="false">Обучающийся</button>
   <button type="button" data-role="admin" aria-pressed="false">Администратор</button>
  </div>
  <input type="hidden" id="role" value="teacher">
  <div class="auth-fields">
   <label class="auth-field">Логин<input id="login" name="username" autocomplete="username" maxlength="64" required autofocus placeholder="Введите логин"></label>
   <label class="auth-field">Пароль<input id="password" name="password" type="password" autocomplete="current-password" maxlength="4096" required placeholder="Введите пароль"></label>
  </div>
  <p id="error" class="auth-error" role="alert" hidden></p>
  <button id="submit" class="auth-submit" type="submit">Войти <span aria-hidden="true">→</span></button>
  <small class="auth-help">Учётные записи преподавателей и обучающихся создаёт администратор. Роли «Оператор 112», «Диспетчер 112» и «Диспетчер службы» назначаются отдельно внутри тренировки.</small>
 </form>
</main>
<script>
(()=>{
 const roles={
  teacher:{label:'Преподаватель',home:'/teacher'},
  student:{label:'Обучающийся',home:'/student'},
  admin:{label:'Администратор',home:'/admin'}
 };
 const qs=new URLSearchParams(location.search);
 const roleInput=document.getElementById('role'),login=document.getElementById('login'),password=document.getElementById('password'),error=document.getElementById('error'),submit=document.getElementById('submit'),title=document.getElementById('title');
 const buttons=[...document.querySelectorAll('[data-role]')];
 const selectRole=value=>{
  if(!roles[value])value='teacher';
  roleInput.value=value;
  buttons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.role===value)));
  title.textContent='Вход · '+roles[value].label;
 };
 buttons.forEach(button=>button.addEventListener('click',()=>selectRole(button.dataset.role)));
 selectRole(roles[qs.get('role')]?qs.get('role'):'teacher');
 const safeNext=value=>typeof value==='string'&&/^\/(admin|teacher|student|cards|training|scenarios)(?:$|[?#])/.test(value)?value:'';
 document.getElementById('login-form').addEventListener('submit',async event=>{
  event.preventDefault();
  error.hidden=true;submit.disabled=true;submit.firstChild.textContent='Входим ';
  try{
   const response=await fetch('/api/v1/auth/login',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({login:login.value.trim(),password:password.value,role:roleInput.value})});
   let body={};try{body=await response.json();}catch{}
   if(!response.ok)throw new Error(body?.error?.message||'Не удалось войти.');
   const next=safeNext(qs.get('next'));
   location.assign(next||body?.data?.home||roles[roleInput.value].home);
  }catch(err){
   error.textContent=err?.message||'Не удалось войти.';error.hidden=false;submit.disabled=false;submit.firstChild.textContent='Войти ';
  }
 });
})();
</script>
</body>
</html>
