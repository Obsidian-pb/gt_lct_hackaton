<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учебные задачи — Тренажёр 112</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div id="nav"></div>
  <div id="who"></div>
</header>
<main>
  <div class="page-title">
    <div>
      <h1>Учебные задачи</h1>
      <p class="sub">Окна 7–8 ТЗ: список задач, диспозиция (сообщение заявителя), эталонная карточка, сложность, утверждение.</p>
    </div>
    <button class="btn" onclick="openEdit('')">+ Новая задача</button>
  </div>

  <section id="listSection"></section>
  <section id="editSection" style="display:none"></section>
</main>

<script src="app.js"></script>
<script>
let DICTS = null;
let SCHEMA_ROWS = []; /* схема доп. полей задачи (строки формы) */

async function load() {
  DICTS = await loadDicts();
  await renderList();
}

/* ---------- список с фильтрами (окно 7) ---------- */
async function renderList() {
  const sec = document.getElementById("listSection");
  const fDifficulty = selectEl([1,2,3,4,5].map(d => ({id: d, name: "Сложность " + d})), "Любая сложность");
  const fStatus = selectEl([
    { id: "draft", name: "Черновик" }, { id: "approved", name: "Утверждена" }, { id: "rejected", name: "Отклонена" },
  ], "Любой статус");
  const fSearch = document.createElement("input");
  fSearch.type = "text";
  fSearch.placeholder = "поиск по сообщению…";

  const bar = filterBar([{ label: "Сложность", el: fDifficulty }, { label: "Статус", el: fStatus }, { label: "Поиск", el: fSearch }]);
  const btn = document.createElement("button");
  btn.className = "btn ghost";
  btn.textContent = "Применить";
  bar.appendChild(btn);

  async function apply() {
    const q = new URLSearchParams();
    if (fDifficulty.value) q.set("difficulty", fDifficulty.value);
    if (fStatus.value) q.set("status", fStatus.value);
    if (fSearch.value.trim()) q.set("search", fSearch.value.trim());
    const tasks = await act(() => api("/study-tasks?" + q.toString()));
    const wrap = document.getElementById("tasksTable") || document.createElement("div");
    wrap.id = "tasksTable";
    wrap.innerHTML = "";
    wrap.appendChild(tableEl([
      { key: "difficulty", label: "Сл." },
      { key: "caller_message", label: "Сообщение заявителя", fmt: trunc },
      { key: "event_class_id", label: "Тип происшествия", fmt: (v) => {
          const g = DICTS.eventGroups.find(x => x.id === v);
          return g ? esc(g.name) : "—";
        } },
      { key: "status", label: "Статус", fmt: v => "<span class='status s-" + esc(v) + "'>" + statusLabel(v) + "</span>" },
      { key: "created_at", label: "Создана", fmt: fmtDate },
      { key: "_act", label: "", fmt: (v, r) =>
          "<button class='btn' onclick='openEdit(\"" + r.id + "\")'>Открыть</button>" +
          (r.status === "draft" || r.status === "rejected" ? "<button class='btn ok' style='margin-left:6px' onclick='decide(\"" + r.id + "\",true)'>Утвердить</button>" : "") },
    ], tasks));
    sec.appendChild(wrap);
  }
  btn.onclick = apply;
  sec.innerHTML = "";
  sec.appendChild(bar);
  await apply();
}

/* ---------- редактор задачи (окно 8) ---------- */
async function openEdit(id) {
  let t = { difficulty: 2, extra_fields: {}, etalon_content: {}, field_schema: [], extra_field_schemas: [] };
  if (id) t = await act(() => api("/study-tasks/" + id));
  const sec = document.getElementById("editSection");
  sec.style.display = "block";
  SCHEMA_ROWS = (t.extra_field_schemas || []).map(x => ({
    code: x.code || "", label: x.label || "", field_type: x.field_type || "text",
    required: !!x.required, options: Array.isArray(x.options) ? x.options : [], sort_order: x.sort_order || 0,
  }));

  const svcOpts = DICTS.services.map(s => "<option value='" + esc(s.id) + "'" + (t.main_service_id === s.id ? " selected" : "") + ">" + esc(s.code + " · " + s.name) + "</option>").join("");
  const appOpts = DICTS.applicantStatuses.map(s => "<option value='" + esc(s.id) + "'" + (t.applicant_status_id === s.id ? " selected" : "") + ">" + esc(s.name) + "</option>").join("");
  const svcMulti = DICTS.services.map(s =>
    "<label class='checkline'><input type='checkbox' class='svc-cb' value='" + esc(s.id) + "'" + ((t.services || []).some(x => x.id === s.id) ? " checked" : "") + "> " + esc(s.code + " · " + s.name) + "</label>").join("");
  const flags = [
    ["has_victims", "Пострадавшие"],
    ["no_scene_refusal", "Нет на месте / отказ от скорой"],
    ["no_access", "Нет доступа / заблаговременно"],
    ["no_contact", "Нет контакта"],
    ["call_dropped", "Срыв звонка"],
  ].map(([k, label]) =>
    "<label class='checkline'><input type='checkbox' id='f_" + k + "'" + (t[k] ? " checked" : "") + "> " + label + "</label>").join("");

  const addr = [
    ["country", "Страна"], ["federal_subject", "Субъект"], ["locality", "Населённый пункт"], ["address_object", "Объект"],
    ["administrative_district", "Округ"], ["district", "Район"], ["street", "Улица"], ["house", "Дом"],
    ["building", "Корпус"], ["structure", "Строение"], ["apartment", "Квартира"], ["entrance", "Подъезд"],
    ["floor", "Этаж"], ["intercom_code", "Код"], ["descriptive_address", "Описательный адрес"],
  ].map(([k, label]) => "<label class='field'>" + label + "<input type='text' id='f_" + k + "' value='" + esc(t[k] ?? "") + "'></label>");

  sec.innerHTML = "<h2>" + (id ? "Учебная задача" : "Новая учебная задача") + "</h2>" +
  "<div class='row'>" +
    "<div class='panel'><h3>Диспозиция (исходные данные)</h3>" +
      "<label class='field'>Сложность (1–5) <select id='f_difficulty'>" + [1,2,3,4,5].map(d => "<option value='" + d + "'" + (t.difficulty === d ? " selected" : "") + ">" + d + "</option>").join("") + "</select></label>" +
      "<label class='field'>Сообщение заявителя *<textarea id='f_caller_message'>" + esc(t.caller_message || "") + "</textarea></label>" +
      "<div class='row'>" +
        "<label class='field'>Телефон (АОН)<input type='text' id='f_aon_phone' value='" + esc(t.aon_phone || "") + "'></label>" +
        "<label class='field'>Телефон (предоставленный)<input type='text' id='f_provided_phone' value='" + esc(t.provided_phone || "") + "'></label>" +
        "<label class='field'>Телефон (на место)<input type='text' id='f_scene_phone' value='" + esc(t.scene_phone || "") + "'></label>" +
      "</div>" +
      "<div class='row'>" +
        "<label class='field'>ФИО заявителя<input type='text' id='f_caller_full_name' value='" + esc(t.caller_full_name || "") + "'></label>" +
        "<label class='field'>Статус заявителя<select id='f_applicant_status_id'><option value=''>— не выбран —</option>" + appOpts + "</select></label>" +
      "</div>" +
      "<label class='field'>Описание со слов заявителя<textarea id='f_incident_description'>" + esc(t.incident_description || "") + "</textarea></label>" +
      "<h3 style='margin-top:12px'>Флаги</h3>" + flags +
    "</div>" +
    "<div class='panel'><h3>Адрес</h3>" +
      "<div class='row'>" + addr.join("") +
        "<label class='field'>Широта<input type='number' step='any' id='f_latitude' value='" + esc(t.latitude ?? "") + "'></label>" +
        "<label class='field'>Долгота<input type='number' step='any' id='f_longitude' value='" + esc(t.longitude ?? "") + "'></label>" +
      "</div>" +
      "<h3 style='margin-top:12px'>Классификация (код Г + признаки 1–3)</h3>" +
      "<div class='row'>" +
        "<label class='field'>Группа происшествий (Г)<select id='f_event_type_id' onchange='onClassChange(\"type\")'><option value=''>— не выбрана —</option></select></label>" +
        "<label class='field'>Признак 1<select id='f_event_feature_1_id' onchange='onClassChange(\"f1\")'><option value=''>— не выбран —</option></select></label>" +
        "<label class='field'>Признак 2<select id='f_event_feature_2_id' onchange='onClassChange(\"f2\")'><option value=''>— не выбран —</option></select></label>" +
        "<label class='field'>Признак 3<select id='f_event_feature_3_id' onchange='onClassChange(\"f3\")'><option value=''>— не выбран —</option></select></label>" +
      "</div>" +
      "<div id='clsInfo' class='note'></div>" +
      "<label class='field'>Тип происшествия (класс события)<select id='f_event_class_id' onchange='updateClsInfo()'><option value=''>— не выбран —</option></select></label>" +
      "<label class='field'>Основная служба<select id='f_main_service_id'><option value=''>— не выбрана —</option>" + svcOpts + "</select></label>" +
      "<h3 style='margin-top:12px'>Привлекаемые службы</h3>" + svcMulti +
      "<h3 style='margin-top:12px'>Доп. поля задачи (схема хранится в БД)</h3>" +
      "<div id='extraSchemaBox'></div>" +
      "<button class='btn ghost' type='button' onclick='addSchemaRow()'>+ Добавить поле схемы</button>" +
      "<label class='field'>Значения доп. полей (extra_fields, JSON)<textarea class='code' id='f_extra_fields'>" + esc(JSON.stringify(t.extra_fields || {}, null, 2)) + "</textarea></label>" +
    "</div>" +
    "<div class='panel'><h3>Эталон (окно 14 — пример заполненной карточки)</h3>" +
      "<div class='note'>Эталон — заполненная карточка происшествия: поля, которые обучающийся должен заполнить (классификация, заявитель, адрес, службы, доп. поля). Сложность и поля задания в эталон не входят.</div>" +
      "<button class='btn' type='button' onclick='fillEtalonFromTask()'>Сформировать эталон из задачи</button>" +
      "<div style='margin-top:8px'></div>" +
      "<label class='field'>Содержимое эталона (etalon_content, JSON)<textarea class='code' id='f_etalon_content'>" + esc(JSON.stringify(t.etalon_content || {}, null, 2)) + "</textarea></label>" +
      "<label class='field'>Схема полей (field_schema, JSON — устаревшее, см. схему доп. полей)<textarea class='code' id='f_field_schema'>" + esc(JSON.stringify(t.field_schema || [], null, 2)) + "</textarea></label>" +
      "<div class='form-actions'>" +
        "<button class='btn ok' onclick='saveTask(\"" + (id || "") + "\")'>Сохранить</button>" +
        (id && t.status === "draft" ? "<button class='btn' onclick='decide(\"" + id + "\",true)'>Утвердить</button>" : "") +
        (id ? "<button class='btn ghost' onclick='genAI(\"" + id + "\")'>Генерация ИИ</button>" : "") +
        (id ? "<button class='btn danger' onclick='delTask(\"" + id + "\")'>Удалить</button>" : "") +
        "<button class='btn ghost' onclick='document.getElementById(\"editSection\").style.display=\"none\"'>Закрыть</button>" +
      "</div>" +
    "</div>" +
  "</div>";
  rebuildCascade(t);
  renderSchema();
  updateClsInfo();
  sec.scrollIntoView({ behavior: "smooth" });
}

/* ---------- классификация: код Г + признаки 1–3 (каскадные селекты) ---------- */
function optEl(id, label, selectedId) {
  return "<option value='" + esc(id) + "'" + (String(id) === String(selectedId) ? " selected" : "") + ">" + esc(label) + "</option>";
}

function rebuildCascade(t) {
  const et = document.getElementById("f_event_type_id");
  const f1 = document.getElementById("f_event_feature_1_id");
  const f2 = document.getElementById("f_event_feature_2_id");
  const f3 = document.getElementById("f_event_feature_3_id");
  const ec = document.getElementById("f_event_class_id");
  if (!et || !f1 || !f2 || !f3 || !ec) return;

  const etVal = t ? (t.event_type_id || "") : et.value;
  const f1Val = t ? (t.event_feature_1_id || "") : f1.value;
  const f2Val = t ? (t.event_feature_2_id || "") : f2.value;
  const f3Val = t ? (t.event_feature_3_id || "") : f3.value;
  const ecVal = t ? (t.event_class_id || "") : ec.value;

  et.innerHTML = "<option value=''>— не выбрана —</option>" +
    (DICTS.eventTypes || []).map(x => optEl(x.id, "Г" + x.code + " · " + x.name, etVal)).join("");
  const f1s = (DICTS.features1 || []).filter(x => x.event_type_id === etVal);
  f1.innerHTML = "<option value=''>— не выбран —</option>" +
    f1s.map(x => optEl(x.id, x.code + " · " + (x.operator_label || x.statistics_name), f1Val)).join("");
  const f2s = (DICTS.features2 || []).filter(x => x.event_feature_1_id === f1Val);
  f2.innerHTML = "<option value=''>— не выбран —</option>" +
    f2s.map(x => optEl(x.id, x.code + " · " + x.name, f2Val)).join("");
  const f3s = (DICTS.features3 || []).filter(x => x.event_feature_2_id === f2Val);
  f3.innerHTML = "<option value=''>— не выбран —</option>" +
    f3s.map(x => optEl(x.id, x.code + " · " + x.name, f3Val)).join("");

  const classes = (DICTS.eventGroups || []).filter(c =>
    c.event_type_id === etVal && c.event_feature_1_id === f1Val &&
    c.event_feature_2_id === f2Val && c.event_feature_3_id === f3Val);
  ec.innerHTML = "<option value=''>— не выбран —</option>" +
    classes.map(x => optEl(x.id, x.event_number + " · " + x.name, ecVal)).join("");
  if (!ecVal && classes.length === 1) ec.value = classes[0].id;
  else ec.value = ecVal;
}

function onClassChange(level) {
  const ids = ["f_event_feature_1_id", "f_event_feature_2_id", "f_event_feature_3_id", "f_event_class_id"];
  const idx = { type: 0, f1: 1, f2: 2, f3: 3 }[level] ?? 0;
  for (let i = idx; i < ids.length; i++) document.getElementById(ids[i]).value = "";
  rebuildCascade(null);
  updateClsInfo();
}

function updateClsInfo() {
  const box = document.getElementById("clsInfo");
  if (!box) return;
  const et = (DICTS.eventTypes || []).find(x => x.id === document.getElementById("f_event_type_id").value);
  const f1 = (DICTS.features1 || []).find(x => x.id === document.getElementById("f_event_feature_1_id").value);
  const f2 = (DICTS.features2 || []).find(x => x.id === document.getElementById("f_event_feature_2_id").value);
  const f3 = (DICTS.features3 || []).find(x => x.id === document.getElementById("f_event_feature_3_id").value);
  const ec = (DICTS.eventGroups || []).find(x => x.id === document.getElementById("f_event_class_id").value);
  const parts = [];
  if (et) parts.push("<b>Группа:</b> Г" + et.code + " «" + esc(et.name) + "»");
  if (f1) parts.push("<b>Признак 1:</b> " + esc(f1.statistics_name || f1.operator_label));
  if (f2) parts.push("<b>Признак 2:</b> " + esc(f2.name));
  if (f3) parts.push("<b>Признак 3:</b> " + esc(f3.name));
  if (ec) parts.push("<b>Класс:</b> №" + ec.event_number + " «" + esc(ec.name) + "»");
  box.innerHTML = parts.length ? parts.join(" · ") : "Выберите группу и признаки 1–3 — класс определится автоматически.";
}

/* ---------- схема доп. полей задачи (строки формы) ---------- */
const FIELD_TYPES = [["text", "Текст"], ["number", "Число"], ["boolean", "Да/Нет"], ["select", "Выбор"], ["date", "Дата"]];

function renderSchema() {
  const box = document.getElementById("extraSchemaBox");
  if (!box) return;
  box.innerHTML = SCHEMA_ROWS.length ? SCHEMA_ROWS.map((r, i) =>
    "<div class='row' style='align-items:center'>" +
      "<label class='field'>Код<input type='text' data-sf='code' data-i='" + i + "' value='" + esc(r.code) + "' placeholder='напр. victim_count'></label>" +
      "<label class='field'>Подпись<input type='text' data-sf='label' data-i='" + i + "' value='" + esc(r.label) + "' placeholder='Кол-во пострадавших'></label>" +
      "<label class='field'>Тип<select data-sf='field_type' data-i='" + i + "'>" +
        FIELD_TYPES.map(([v, l]) => "<option value='" + v + "'" + (r.field_type === v ? " selected" : "") + ">" + l + "</option>").join("") +
      "</select></label>" +
      "<label class='field' style='max-width:90px'>Порядок<input type='number' data-sf='sort_order' data-i='" + i + "' value='" + esc(r.sort_order) + "'></label>" +
      "<label class='checkline'><input type='checkbox' data-sf='required' data-i='" + i + "'" + (r.required ? " checked" : "") + "> обяз.</label>" +
      "<label class='field'>Варианты (JSON)<input type='text' data-sf='options' data-i='" + i + "' value='" + esc(JSON.stringify(r.options)) + "' placeholder='[\"вариант1\",\"вариант2\"]'></label>" +
      "<button class='btn danger' type='button' onclick='delSchemaRow(" + i + ")'>✕</button>" +
    "</div>").join("")
    : "<div class='note'>Схема доп. полей пуста — поля отсутствуют.</div>";
}

function addSchemaRow() {
  SCHEMA_ROWS.push({ code: "", label: "", field_type: "text", required: false, options: [], sort_order: SCHEMA_ROWS.length });
  renderSchema();
}

function delSchemaRow(i) {
  SCHEMA_ROWS.splice(i, 1);
  renderSchema();
}

function collectSchemaRows() {
  SCHEMA_ROWS.forEach((r, i) => {
    const g = id => document.querySelector("[data-sf='" + id + "'][data-i='" + i + "']");
    r.code = (g("code") && g("code").value.trim()) || "";
    r.label = (g("label") && g("label").value.trim()) || "";
    r.field_type = (g("field_type") && g("field_type").value) || "text";
    r.required = !!(g("required") && g("required").checked);
    r.sort_order = Number((g("sort_order") && g("sort_order").value) || 0);
    try { r.options = JSON.parse((g("options") && g("options").value) || "[]"); }
    catch (e) { r.options = []; }
  });
  return SCHEMA_ROWS.filter(r => r.code && r.label);
}

/* ---------- эталон: формирование из данных задачи (все поля, кроме сложности) ---------- */
function fillEtalonFromTask() {
  const et = {};
  const pick = (...ids) => {
    const el = document.getElementById(ids[0]);
    return el ? (el.value || "").trim() : "";
  };
  // Классификация текстом
  const etObj = (DICTS.eventTypes || []).find(x => x.id === document.getElementById("f_event_type_id").value);
  const f1Obj = (DICTS.features1 || []).find(x => x.id === document.getElementById("f_event_feature_1_id").value);
  const f2Obj = (DICTS.features2 || []).find(x => x.id === document.getElementById("f_event_feature_2_id").value);
  const f3Obj = (DICTS.features3 || []).find(x => x.id === document.getElementById("f_event_feature_3_id").value);
  const ecObj = (DICTS.eventGroups || []).find(x => x.id === document.getElementById("f_event_class_id").value);
  if (etObj) et.event_type = "Г" + etObj.code + " " + etObj.name;
  if (f1Obj) et.feature_1 = f1Obj.statistics_name || f1Obj.operator_label;
  if (f2Obj) et.feature_2 = f2Obj.name;
  if (f3Obj) et.feature_3 = f3Obj.name;
  if (ecObj) et.event_class = "№" + ecObj.event_number + " " + ecObj.name;
  // Заявитель и адрес
  et.caller_message = pick("f_caller_message");
  et.aon_phone = pick("f_aon_phone");
  et.provided_phone = pick("f_provided_phone");
  et.scene_phone = pick("f_scene_phone");
  et.caller_full_name = pick("f_caller_full_name");
  et.incident_description = pick("f_incident_description");
  ["country","federal_subject","locality","address_object","administrative_district","district",
   "street","house","building","structure","apartment","entrance","floor","intercom_code",
   "descriptive_address"].forEach(k => { const v = pick("f_" + k); if (v) et[k] = v; });
  // Службы
  const svcIds = Array.from(document.querySelectorAll("#editSection input.svc-cb:checked")).map(i => i.value);
  et.services = svcIds.map(id => { const s = DICTS.services.find(x => x.id === id); return s ? s.name : id; });
  // Доп. поля по схеме: значения из extra_fields JSON
  let extra = {};
  try { extra = JSON.parse(document.getElementById("f_extra_fields").value || "{}"); } catch (e) { /* ignore */ }
  collectSchemaRows().forEach(r => { if (r.code in extra) et["extra." + r.code] = extra[r.code]; });
  document.getElementById("f_etalon_content").value = JSON.stringify(et, null, 2);
  toast("Эталон сформирован из задачи — проверьте и при необходимости отредактируйте JSON", "info");
}

function val(id) { return document.getElementById(id).value.trim(); }

function collectPayload() {
  let extra = {}, etalon = {}, schema = [];
  try { extra = JSON.parse(document.getElementById("f_extra_fields").value || "{}"); }
  catch (e) { throw new Error("extra_fields: невалидный JSON"); }
  try { etalon = JSON.parse(document.getElementById("f_etalon_content").value || "{}"); }
  catch (e) { throw new Error("etalon_content: невалидный JSON"); }
  try { schema = JSON.parse(document.getElementById("f_field_schema").value || "[]"); }
  catch (e) { throw new Error("field_schema: невалидный JSON"); }
  const extraSchemas = collectSchemaRows();

  const payload = {
    difficulty: Number(document.getElementById("f_difficulty").value) || 2,
    caller_message: val("f_caller_message"),
    aon_phone: val("f_aon_phone") || null,
    provided_phone: val("f_provided_phone") || null,
    scene_phone: val("f_scene_phone") || null,
    caller_full_name: val("f_caller_full_name") || null,
    applicant_status_id: document.getElementById("f_applicant_status_id").value || null,
    country: val("f_country") || null, federal_subject: val("f_federal_subject") || null,
    locality: val("f_locality") || null, address_object: val("f_address_object") || null,
    administrative_district: val("f_administrative_district") || null, district: val("f_district") || null,
    street: val("f_street") || null, house: val("f_house") || null, building: val("f_building") || null,
    structure: val("f_structure") || null, apartment: val("f_apartment") || null, entrance: val("f_entrance") || null,
    floor: val("f_floor") || null, intercom_code: val("f_intercom_code") || null, descriptive_address: val("f_descriptive_address") || null,
    latitude: parseFloat(val("f_latitude")) || null, longitude: parseFloat(val("f_longitude")) || null,
    incident_description: val("f_incident_description") || null,
    has_victims: document.getElementById("f_has_victims").checked,
    no_scene_refusal: document.getElementById("f_no_scene_refusal").checked,
    no_access: document.getElementById("f_no_access").checked,
    no_contact: document.getElementById("f_no_contact").checked,
    call_dropped: document.getElementById("f_call_dropped").checked,
    event_type_id: document.getElementById("f_event_type_id").value || null,
    event_feature_1_id: document.getElementById("f_event_feature_1_id").value || null,
    event_feature_2_id: document.getElementById("f_event_feature_2_id").value || null,
    event_feature_3_id: document.getElementById("f_event_feature_3_id").value || null,
    event_class_id: document.getElementById("f_event_class_id").value || null,
    main_service_id: document.getElementById("f_main_service_id").value || null,
    service_ids: Array.from(document.querySelectorAll("#editSection input.svc-cb:checked")).map(i => i.value),
    extra_fields: extra,
    etalon_content: etalon,
    field_schema: schema,
    extra_field_schemas: extraSchemas,
  };
  if (!payload.caller_message) throw new Error("Заполните сообщение заявителя");
  return payload;
}

async function saveTask(id) {
  let payload;
  try { payload = collectPayload(); } catch (e) { toast(e.message, "err"); return; }
  await act(async () => {
    if (id) await api("/study-tasks/" + id, { method: "PATCH", json: payload });
    else await api("/study-tasks", { method: "POST", json: payload });
  }, "Задача сохранена");
  document.getElementById("editSection").style.display = "none";
  await renderList();
}

async function decide(id, approve) {
  await act(async () => {
    await api("/study-tasks/" + id + "/approve", { method: "POST", json: { approve } });
  }, approve ? "Задача утверждена" : "Задача отклонена");
  document.getElementById("editSection").style.display = "none";
  await renderList();
}

async function delTask(id) {
  if (!confirm("Удалить учебную задачу?")) return;
  await act(() => api("/study-tasks/" + id, { method: "DELETE" }), "Удалена");
  document.getElementById("editSection").style.display = "none";
  await renderList();
}

async function genAI(id) {
  try {
    await act(() => api("/study-tasks/" + id + "/generate", { method: "POST" }));
  } catch (e) {
    /* 501 — ожидаемая заглушка */
    toast("Генерация ИИ пока не реализована на бэкенде (501). Эталон заполняется вручную.", "info");
  }
}

async function init() {
  await renderHeader("tasks.html");
  await load();
}
init().catch(e => toast(e.message, "err"));
</script>
</body>
</html>
