<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренировки — Тренажёр 112</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div id="nav"></div>
  <div id="who"></div>
</header>
<main>
  <div class="page-title">
    <div>
      <h1>Тренировки</h1>
      <p class="sub">Окна 10–11 ТЗ: список тренировок, настройка (сценарии + обучающиеся с ролями), активация, завершение, прогресс.</p>
    </div>
    <button class="btn" id="btnCreate" onclick="openEdit('')">+ Новая тренировка</button>
  </div>

  <section id="listSection"></section>
  <section id="editSection" style="display:none"></section>
</main>

<script src="app.js"></script>
<script>
let DICTS = null;
let USERS = [];
let ME = null;

async function init() {
  await renderHeader("trainings.html");
  ME = await me();
  DICTS = await loadDicts();
  const isStaff = hasAny(ME, STAFF);
  document.getElementById("btnCreate").style.display = isStaff ? "" : "none";
  await renderList();
}

async function renderList() {
  const trainings = await act(() => api("/trainings"));
  const sec = document.getElementById("listSection");
  sec.innerHTML = "";
  sec.appendChild(tableEl([
    { key: "title", label: "Название" },
    { key: "status", label: "Состояние", fmt: v => "<span class='status s-" + esc(v) + "'>" + statusLabel(v) + "</span>" },
    { key: "difficulty", label: "Сложность" },
    { key: "mode", label: "Режим", fmt: v => v === "training" ? "Обучение" : "Тестирование" },
    { key: "scenario_count", label: "Сценариев" },
    { key: "participant_count", label: "Участников" },
    { key: "starts_at", label: "Начало", fmt: fmtDate },
    { key: "_act", label: "Действие", fmt: (v, r) => {
        let b = "<button class='btn' onclick='openEdit(\"" + r.id + "\")'>Открыть</button>";
        if (hasAny(ME, STAFF)) {
          if (r.status === "prepared") b += "<button class='btn' style='margin-left:6px' onclick='activate(\"" + r.id + "\")'>Активировать</button>";
          if (r.status === "active") b += "<button class='btn ghost' style='margin-left:6px' onclick='finish(\"" + r.id + "\")'>Завершить</button>";
        } else if (r.status === "active") {
          b += "<button class='btn ok' style='margin-left:6px' onclick='location.href=\"simulator.html?training=" + esc(r.id) + "\"'>Пройти</button>";
        }
        return b;
      } },
  ], trainings, "Тренировок нет"));
}

/* ---------- создание / редактирование (окно 11) ---------- */
async function openEdit(id) {
  let t = null;
  if (id) t = await act(() => api("/trainings/" + id));
  const sec = document.getElementById("editSection");
  sec.style.display = "block";

  const scenOpts = DICTS.eventGroups ? [] : [];
  const scenarios = await api("/scenarios").catch(() => []);
  const scenarioRows = scenarios.map(s =>
    "<label class='checkline'><input type='checkbox' class='scn-cb' value='" + esc(s.id) + "'" +
    (t && t.scenarios.some(x => x.id === s.id) ? " checked" : "") + "> " + esc(s.topic) + " <span class='muted'>(задач: " + s.task_count + ")</span></label>").join("");

  sec.innerHTML = "<h2>" + (id ? "Тренировка" : "Новая тренировка") + "</h2><div class='row'>" +
    "<div class='panel'><h3>Параметры</h3>" +
      "<label class='field'>Название *<input type='text' id='t_title' value='" + esc((t && t.title) || "") + "'></label>" +
      "<label class='field'>Описание<textarea id='t_description'>" + esc((t && t.description) || "") + "</textarea></label>" +
      "<div class='row'>" +
        "<label class='field'>Дата начала<input type='datetime-local' id='t_starts' value='" + dtLocal(t && t.starts_at) + "'></label>" +
        "<label class='field'>Дата окончания<input type='datetime-local' id='t_ends' value='" + dtLocal(t && t.ends_at) + "'></label>" +
      "</div>" +
      "<div class='row'>" +
        "<label class='field'>Сложность<select id='t_difficulty'>" +
          [["low","Низкая"],["medium","Средняя"],["high","Высокая"],["adaptive","Адаптивная"]]
            .map(([v, l]) => "<option value='" + v + "'" + ((t && t.difficulty) === v || (!t && v === "medium") ? " selected" : "") + ">" + l + "</option>").join("") +
        "</select></label>" +
        "<label class='field'>Режим<select id='t_mode'>" +
          [["training","Обучение"],["testing","Тестирование"]]
            .map(([v, l]) => "<option value='" + v + "'" + ((t && t.mode) === v || (!t && v === "training") ? " selected" : "") + ">" + l + "</option>").join("") +
        "</select></label>" +
        "<label class='field'>Лимит времени на карточку, сек<input type='number' id='t_limit' value='" + ((t && t.card_time_limit_seconds) || 30) + "'></label>" +
      "</div>" +
      "<h3 style='margin-top:12px'>Учебные сценарии</h3>" +
      (scenarioRows || "<div class='note'>Сценариев ещё нет — создайте их в разделе «Сценарии».</div>") +
      "<div class='form-actions'>" +
        "<button class='btn ok' onclick='saveTraining(\"" + (id || "") + "\")'>Сохранить</button>" +
        (id ? "<button class='btn danger' onclick='delTraining(\"" + id + "\")'>Удалить</button>" : "") +
        "<button class='btn ghost' onclick='document.getElementById(\"editSection\").style.display=\"none\"'>Закрыть</button>" +
      "</div>" +
    "</div>" +
    (id ? "<div class='panel'><h3>Участники (" + t.participants.length + ")</h3><div id='partsBox'></div></div>" : "") +
    (id ? "<div class='panel'><h3>Прогресс</h3><div id='progressBox'></div></div>" : "") +
  "</div>";

  if (id) {
    await renderParts(id, t);
    await renderProgress(id);
  }
  sec.scrollIntoView({ behavior: "smooth" });
}

function dtLocal(v) {
  if (!v) return "";
  const d = new Date(v);
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
}

async function renderParts(id, t) {
  const box = document.getElementById("partsBox");
  const users = USERS.length ? USERS : (USERS = await loadUsers());
  const roles = DICTS.trainingRoles;

  const nameOf = uid => {
    const u = users.find(x => x.id === uid);
    return u ? esc(u.last_name + " " + u.first_name + " (" + u.username + ")") : esc(uid);
  };
  const roleName = rid => {
    const r = roles.find(x => x.id === rid);
    return r ? esc(r.name) : esc(rid);
  };

  box.innerHTML = "";
  box.appendChild(tableEl([
    { key: "user_id", label: "Обучающийся", fmt: nameOf },
    { key: "training_role_id", label: "Роль обучающегося", fmt: roleName },
    { key: "service_id", label: "Служба (для диспетчера службы)", fmt: v => {
        const s = DICTS.services.find(x => x.id === v);
        return s ? esc(s.name) : "—";
      } },
    { key: "_act", label: "", fmt: (v, r) =>
        "<button class='btn danger' onclick='removePart(\"" + id + "\",\"" + r.user_id + "\")'>Снять</button>" },
  ], t.participants, "Участники не назначены"));

  const studentUsers = users.filter(u => roleCodes(u).includes("student"));
  box.insertAdjacentHTML("beforeend",
    "<h3>Назначить обучающегося</h3><div class='filter-bar'>" +
    "<span>Обучающийся:</span><select id='p_user'>" +
      studentUsers.map(u => "<option value='" + esc(u.id) + "'>" + esc(u.last_name + " " + u.first_name + " (" + u.username + ")") + "</option>").join("") +
    "</select>" +
    "<span>Роль:</span><select id='p_role' onchange='onRoleChange()'>" +
      roles.map(r => "<option value='" + esc(r.id) + "'>" + esc(r.name) + "</option>").join("") +
    "</select>" +
    "<span>Служба:</span><select id='p_service' style='display:none'>" +
      "<option value=''>— не выбрана —</option>" +
      DICTS.services.map(s => "<option value='" + esc(s.id) + "'>" + esc(s.name) + "</option>").join("") +
    "</select>" +
    "<button class='btn' onclick='addPart(\"" + id + "\")'>+ Назначить</button></div>" +
    "<div class='note'>Роль «Диспетчер службы» требует выбора службы (ТЗ 35).</div>");
  onRoleChange();
}

function onRoleChange() {
  const sel = document.getElementById("p_role");
  const role = DICTS.trainingRoles.find(r => r.id === sel.value);
  document.getElementById("p_service").style.display = role && role.code === "service_dispatcher" ? "" : "none";
}

async function addPart(id) {
  const payload = {
    user_id: document.getElementById("p_user").value,
    training_role_id: document.getElementById("p_role").value,
    service_id: document.getElementById("p_service").value || null,
  };
  if (!payload.user_id || !payload.training_role_id) { toast("Выберите обучающегося и роль", "err"); return; }
  await act(async () => {
    await api("/trainings/" + id + "/participants", { method: "POST", json: payload });
  }, "Обучающийся назначен");
  await openEdit(id);
}

async function removePart(id, userId) {
  await act(async () => {
    await api("/trainings/" + id + "/participants/" + userId, { method: "DELETE" });
  }, "Обучающийся снят");
  await openEdit(id);
}

async function renderProgress(id) {
  const box = document.getElementById("progressBox");
  try {
    const p = await act(() => api("/trainings/" + id + "/progress"));
    box.innerHTML =
      "<p>Всего карточек: <b>" + p.total_cards + "</b> · отправлено: <b>" + p.submitted_cards + "</b> · оценено: <b>" + p.evaluated_cards + "</b>" +
      " · среднее время: " + fmtNum(p.avg_duration_ms ? p.avg_duration_ms / 1000 : null) + " с</p>";
    if (p.participants && p.participants.length) {
      box.appendChild(tableEl([
        { key: "user_id", label: "Участник" },
        { key: "total", label: "Всего" },
        { key: "submitted", label: "Отправлено" },
        { key: "avg_score", label: "Средняя оценка" },
      ], p.participants.map(x => ({
        user_id: x.user_id || x.username || "—",
        total: (x.total !== undefined ? x.total : x.total_cards) ?? "",
        submitted: (x.submitted !== undefined ? x.submitted : x.submitted_cards) ?? "",
        avg_score: fmtNum(x.avg_score !== undefined ? x.avg_score : x.avg_machine_score),
      })), "Нет данных по участникам"));
    }
  } catch (e) {
    box.innerHTML = "<div class='note'>Прогресс доступен преподавателю/администратору.</div>";
  }
}

async function saveTraining(id) {
  const title = document.getElementById("t_title").value.trim();
  if (!title) { toast("Укажите название тренировки", "err"); return; }
  const scenario_ids = Array.from(document.querySelectorAll("#editSection input.scn-cb:checked")).map(i => i.value);
  const payload = {
    title,
    description: document.getElementById("t_description").value.trim() || null,
    starts_at: document.getElementById("t_starts").value ? new Date(document.getElementById("t_starts").value).toISOString() : null,
    ends_at: document.getElementById("t_ends").value ? new Date(document.getElementById("t_ends").value).toISOString() : null,
    difficulty: document.getElementById("t_difficulty").value,
    mode: document.getElementById("t_mode").value,
    card_time_limit_seconds: Number(document.getElementById("t_limit").value) || 30,
    scenario_ids,
  };
  await act(async () => {
    if (id) await api("/trainings/" + id, { method: "PATCH", json: payload });
    else await api("/trainings", { method: "POST", json: payload });
  }, "Тренировка сохранена");
  document.getElementById("editSection").style.display = "none";
  await renderList();
}

async function activate(id) {
  await act(async () => {
    await api("/trainings/" + id + "/activate", { method: "POST" });
  }, "Тренировка активирована");
  await openEdit(id);
  await renderList();
}

async function finish(id) {
  if (!confirm("Завершить тренировку? После этого её нельзя изменить.")) return;
  await act(async () => {
    await api("/trainings/" + id + "/finish", { method: "POST" });
  }, "Тренировка завершена");
  await openEdit(id);
  await renderList();
}

async function delTraining(id) {
  if (!confirm("Удалить тренировку?")) return;
  await act(() => api("/trainings/" + id, { method: "DELETE" }), "Удалена");
  document.getElementById("editSection").style.display = "none";
  await renderList();
}

init().catch(e => toast(e.message, "err"));
</script>
</body>
</html>
