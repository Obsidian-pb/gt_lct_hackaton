<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Личный кабинет — Тренажёр 112</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div id="nav"></div>
  <div id="who"></div>
</header>
<main>
  <div class="page-title">
    <div>
      <h1 id="hello">Личный кабинет</h1>
      <p class="sub" id="roleLine"></p>
    </div>
    <button class="btn" onclick="location.href='simulator.html'">Эмулятор АРМ-112</button>
  </div>

  <section id="menuSection"></section>
  <section id="statsSection"></section>
</main>

<script src="app.js"></script>
<script>
async function init() {
  await renderHeader("dashboard.html");
  const user = await me();
  const codes = roleCodes(user);
  document.getElementById("hello").textContent =
    "Кабинет: " + esc(user.last_name + " " + user.first_name + (user.middle_name ? " " + user.middle_name : ""));
  document.getElementById("roleLine").textContent = "Роли: " + codes.join(", ") + " · логин: " + user.username;

  const isStaff = hasAny(user, STAFF);
  const isAdmin = hasAny(user, ["system_admin", "admin"]);

  /* Меню по ролям (окна 2–4 ТЗ) */
  const menu = [];
  if (isAdmin) {
    menu.push(["Пользователи (12–13)", "users.html", "Добавление, редактирование, роли, удаление пользователей."]);
    menu.push(["Справочники (28–35)", "reference.html", "Службы, статусы сценариев и заявителей, роли обучающихся, группы происшествий."]);
    menu.push(["Система (19–27)", "system.html", "Мониторинг, настройки, журнал аудита."]);
  }
  if (isStaff) {
    menu.push(["Учебные задачи (7–8)", "tasks.html", "Диспозиция и эталон, сложность, утверждение."]);
    menu.push(["Учебные сценарии (5–6)", "scenarios.html", "Тема, набор задач, статус, утверждение."]);
    menu.push(["Карточки (15)", "cards.html", "Все заполненные учебные карточки, итоговые оценки."]);
    menu.push(["Отчёты (16)", "reports.html", "Успеваемость, статистика, экспорт CSV."]);
  }
  menu.push(["Тренировки (10–11)", "trainings.html", "Список, настройка, участники, активация, прогресс."]);
  menu.push(["Методические материалы (18)", "materials.html", "Справочная база: инструкции, памятки."]);
  menu.push(["Эмулятор АРМ-112 (17, 36)", "simulator.html", "Приём вызова, карточка, окно диспетчера."]);

  const sec = document.getElementById("menuSection");
  sec.innerHTML = "<h2>Разделы</h2><div class='grid'></div>";
  const grid = sec.querySelector(".grid");
  for (const [title, href, desc] of menu) {
    grid.insertAdjacentHTML("beforeend",
      "<a class='card' href='" + href + "' style='text-decoration:none;color:inherit'>" +
      "<h3>" + esc(title) + "</h3><p class='sub' style='margin:0'>" + esc(desc) + "</p></a>");
  }

  /* Сводки */
  const st = document.getElementById("statsSection");
  st.innerHTML = "<h2>Сводка</h2><div class='grid' id='statCards'></div>";
  const sc = document.getElementById("statCards");

  if (isStaff) {
    try {
      const s = await act(() => api("/reports/summary"));
      sc.innerHTML +=
        "<div class='card'><h3>Карточки</h3><p>Всего: <b>" + s.total_cards + "</b> · Отправлено: <b>" + s.submitted_cards +
        "</b> · Оценено: <b>" + s.evaluated_cards + "</b></p>" +
        "<p class='muted'>Средняя машинная оценка: " + fmtNum(s.avg_machine_score) +
        " · средняя итоговая: " + fmtNum(s.avg_final_score) + "</p></div>";
    } catch (e) { showError(sc, e); }
    try {
      const ts = await act(() => api("/trainings"));
      sc.innerHTML +=
        "<div class='card'><h3>Тренировки</h3><p>Всего: <b>" + ts.length + "</b></p>" +
        "<p class='muted'>" + ts.map(t => esc(t.title) + " — " + statusLabel(t.status)).join("<br>") + "</p></div>";
    } catch (e) { showError(sc, e); }
  } else {
    /* Обучающийся: назначенные тренировки, кнопка «Пройти» */
    try {
      const ts = await act(() => api("/trainings"));
      if (!ts.length) {
        sc.innerHTML = "<div class='note'>Вам пока не назначены тренировки.</div>";
      } else {
        sc.appendChild(tableEl([
          { key: "title", label: "Название" },
          { key: "status", label: "Состояние", fmt: v => "<span class='status s-" + esc(v) + "'>" + statusLabel(v) + "</span>" },
          { key: "difficulty", label: "Сложность" },
          { key: "mode", label: "Режим" },
          { key: "starts_at", label: "Начало", fmt: fmtDate },
          { key: "_act", label: "Действие", fmt: (v, r) =>
              r.status === "active"
                ? "<button class='btn ok' onclick=\"location.href='simulator.html?training=" + esc(r.id) + "'\">Пройти</button>"
                : "—" },
        ], ts, "Нет назначенных тренировок"));
      }
    } catch (e) { showError(sc, e); }
  }
}
init().catch(e => {
  if (!location.pathname.endsWith("index.html")) {
    toast(e.message, "err");
    setTimeout(() => location.href = "index.html", 900);
  }
});
</script>
</body>
</html>
