<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учебные сценарии — Тренажёр 112</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div id="nav"></div>
  <div id="who"></div>
</header>
<main>
  <div class="page-title">
    <div>
      <h1>Учебные сценарии</h1>
      <p class="sub">Окна 5–6 ТЗ: перечень сценариев; сценарий = тема + набор учебных задач + статус.</p>
    </div>
    <button class="btn" onclick="openEdit('')">+ Новый сценарий</button>
  </div>

  <section id="listSection"></section>
  <section id="editSection" style="display:none"></section>
</main>

<script src="app.js"></script>
<script>
let DICTS = null;

async function init() {
  await renderHeader("scenarios.html");
  DICTS = await loadDicts();
  await renderList();
}

async function renderList() {
  const scenarios = await act(() => api("/scenarios"));
  const sec = document.getElementById("listSection");
  sec.innerHTML = "";
  sec.appendChild(tableEl([
    { key: "topic", label: "Тема" },
    { key: "description", label: "Описание", fmt: trunc },
    { key: "scenario_status_id", label: "Статус", fmt: (v) => {
        const s = DICTS.scenarioStatuses.find(x => x.id === v);
        return s ? "<span class='tag'>" + esc(s.name) + "</span>" : "—";
      } },
    { key: "task_count", label: "Задач" },
    { key: "approved_at", label: "Утверждён", fmt: fmtDate },
    { key: "created_at", label: "Создан", fmt: fmtDate },
    { key: "_act", label: "", fmt: (v, r) =>
        "<button class='btn' onclick='openEdit(\"" + r.id + "\")'>Открыть</button>" },
  ], scenarios, "Сценариев пока нет"));
}

async function openEdit(id) {
  let s = null;
  if (id) s = await act(() => api("/scenarios/" + id));
  const sec = document.getElementById("editSection");
  sec.style.display = "block";

  const statusOpts = DICTS.scenarioStatuses.map(x =>
    "<option value='" + esc(x.id) + "'" + (s && s.scenario_status_id === x.id ? " selected" : "") + ">" + esc(x.name) + "</option>").join("");

  let html = "<h2>" + (id ? "Учебный сценарий" : "Новый сценарий") + "</h2><div class='row'>" +
    "<div class='panel'>" +
      "<label class='field'>Тема *<input type='text' id='s_topic' value='" + esc((s && s.topic) || "") + "'></label>" +
      "<label class='field'>Описание<textarea id='s_description'>" + esc((s && s.description) || "") + "</textarea></label>" +
      "<label class='field'>Статус<select id='s_status'><option value=''>— не выбран —</option>" + statusOpts + "</select></label>" +
      "<div class='form-actions'>" +
        "<button class='btn ok' onclick='saveScenario(\"" + (id || "") + "\")'>Сохранить</button>" +
        (id && !s.approved_at ? "<button class='btn' onclick='approveScenario(\"" + id + "\")'>Утвердить</button>" : "") +
        (id ? "<button class='btn danger' onclick='delScenario(\"" + id + "\")'>Удалить</button>" : "") +
        "<button class='btn ghost' onclick='document.getElementById(\"editSection\").style.display=\"none\"'>Закрыть</button>" +
      "</div>" +
    "</div>" +
    (id ? "<div class='panel'><h3>Учебные задачи (" + s.tasks.length + ")</h3><div id='tasksBox'></div></div>" : "") +
  "</div>";
  sec.innerHTML = html;

  if (id) {
    const box = document.getElementById("tasksBox");
    box.innerHTML = "";
    box.appendChild(tableEl([
      { key: "difficulty", label: "Сл." },
      { key: "caller_message", label: "Сообщение заявителя", fmt: trunc },
      { key: "status", label: "Статус", fmt: v => statusLabel(v) },
      { key: "_act", label: "", fmt: (v, r) =>
          "<button class='btn danger' onclick='removeTask(\"" + id + "\",\"" + r.id + "\")'>Убрать</button>" },
    ], s.tasks, "Задач в сценарии нет"));

    /* Добавление задачи из списка утверждённых */
    const approved = DICTS.eventGroups && (await api("/study-tasks")).filter(t => t.status === "approved");
    if (approved && approved.length) {
      box.insertAdjacentHTML("beforeend",
        "<div class='filter-bar' style='margin-top:10px'><span>Добавить задачу:</span><select id='addTaskSel'>" +
        approved.map(t => "<option value='" + esc(t.id) + "'>" + esc(t.difficulty + " · " + t.caller_message.slice(0, 60)) + "</option>").join("") +
        "</select><button class='btn' onclick='addTask(\"" + id + "\")'>+ Добавить</button></div>");
    } else {
      box.insertAdjacentHTML("beforeend", "<div class='note'>Нет утверждённых задач. Сначала утвердите задачу в разделе «Учебные задачи» (в сценарий можно включать только утверждённые задачи).</div>");
    }
  }
  sec.scrollIntoView({ behavior: "smooth" });
}

async function saveScenario(id) {
  const topic = document.getElementById("s_topic").value.trim();
  if (!topic) { toast("Укажите тему сценария", "err"); return; }
  const payload = {
    topic,
    description: document.getElementById("s_description").value.trim() || null,
    scenario_status_id: document.getElementById("s_status").value || null,
  };
  await act(async () => {
    if (id) await api("/scenarios/" + id, { method: "PATCH", json: payload });
    else await api("/scenarios", { method: "POST", json: payload });
  }, "Сценарий сохранён");
  document.getElementById("editSection").style.display = "none";
  await renderList();
}

async function addTask(id) {
  const sel = document.getElementById("addTaskSel");
  if (!sel.value) { toast("Выберите задачу", "err"); return; }
  await act(async () => {
    await api("/scenarios/" + id + "/tasks", { method: "POST", json: { study_task_id: sel.value } });
  }, "Задача добавлена");
  await openEdit(id);
}

async function removeTask(id, taskId) {
  await act(async () => {
    await api("/scenarios/" + id + "/tasks/" + taskId, { method: "DELETE" });
  }, "Задача убрана");
  await openEdit(id);
}

async function approveScenario(id) {
  await act(async () => {
    await api("/scenarios/" + id + "/approve", { method: "POST" });
  }, "Сценарий утверждён");
  await openEdit(id);
}

async function delScenario(id) {
  if (!confirm("Удалить сценарий?")) return;
  await act(() => api("/scenarios/" + id, { method: "DELETE" }), "Удалён");
  document.getElementById("editSection").style.display = "none";
  await renderList();
}

init().catch(e => toast(e.message, "err"));
</script>
</body>
</html>
